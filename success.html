<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Order Successful</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,Helvetica,sans-serif;
}

body{

    background:#f5efe8;

    display:flex;
    justify-content:center;
    align-items:center;

    height:100vh;
}

.success{

    width:90%;
    max-width:500px;

    background:white;

    border-radius:20px;

    padding:40px;

    text-align:center;

    box-shadow:0 10px 30px rgba(0,0,0,.2);

    animation:pop .8s ease;

}

@keyframes pop{

0%{
transform:scale(.5);
opacity:0;
}

100%{
transform:scale(1);
opacity:1;
}

}

.tick{

font-size:90px;

animation:bounce 1s infinite alternate;

}

@keyframes bounce{

from{
transform:translateY(0);
}

to{
transform:translateY(-10px);
}

}

h1{

color:#28a745;

margin-top:15px;

margin-bottom:20px;

}

p{

font-size:18px;

line-height:32px;

color:#555;

}

.btn{

display:inline-block;

margin-top:30px;

padding:15px 35px;

background:#6b3f20;

color:white;

text-decoration:none;

border-radius:10px;

font-size:18px;

transition:.3s;

}

.btn:hover{

background:#4a2813;

transform:scale(1.05);

}

.timer{

margin-top:25px;

font-size:20px;

font-weight:bold;

color:#d35400;

}

.small{

margin-top:15px;

font-size:15px;

color:gray;

}

</style>

</head>

<body>

<div class="success">

<div class="tick">

🎉✅

</div>

<h1>Order Sent Successfully!</h1>

<p>

Thank you for choosing

<b>Vyora Cafe</b>

<br><br>

🍽️ Your order has been sent to our WhatsApp.

<br>

Our team will prepare it shortly.

</p>

<div class="timer">

⏰ Estimated Time

<br>

15 - 20 Minutes

</div>

<p class="small">

You will receive your delicious food soon.

</p>

<a href="index.html" class="btn">

🏠 Back to Home

</a>

</div>

<script>

setTimeout(function(){

window.location.href="index.html";

},5000);

</script>

</body>

</html>
